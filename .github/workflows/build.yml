name: Build Pitchly VST3

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O2 -std=c++17 tests/engine_test.cpp -o engine_test && ./engine_test

  vst3:
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64,   runner: windows-latest,  arch: x64 }
          - { name: ARM64, runner: windows-11-arm,  arch: ARM64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DPITCHLY_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/Pitchly_artefacts/Release/VST3/Pitchly.vst3 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Pitchly-VST3-${{ matrix.name }}
          path: dist
